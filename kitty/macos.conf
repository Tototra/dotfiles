# ── Réglages macOS (chargés automatiquement) ──
macos_option_as_alt               left
macos_quit_when_last_window_closed yes
macos_titlebar_color              background
macos_show_window_title_in        none
macos_colorspace                  displayp3
macos_thicken_font                0.25

# ── Tes raccourcis cmd d'origine (conservés) ──
map cmd+d         launch --location=vsplit --cwd=current
map cmd+shift+d   launch --location=hsplit --cwd=current
map cmd+h         neighboring_window left
map cmd+l         neighboring_window right
map cmd+k         neighboring_window up
map cmd+j         neighboring_window down
map cmd+left      resize_window narrower 5
map cmd+right     resize_window wider 5
map cmd+up        resize_window taller 5
map cmd+down      resize_window shorter 5
map cmd+t         new_tab_with_cwd
map cmd+w         close_tab
map cmd+shift+w   close_window
map cmd+shift+]   next_tab
map cmd+shift+[   previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab -1
map cmd+equal     change_font_size all +1.0
map cmd+minus     change_font_size all -1.0
map cmd+0         change_font_size all 0
map cmd+c         copy_to_clipboard
map cmd+v         paste_from_clipboard
map cmd+shift+k   scroll_line_up
map cmd+shift+j   scroll_line_down
map cmd+shift+u   scroll_page_up
map cmd+shift+home scroll_home
map cmd+shift+end  scroll_end
map cmd+shift+f5  load_config_file
map cmd+return    toggle_fullscreen
map cmd+shift+l   next_layout
# Début de ligne / effacer la ligne
# cmd+a : sélectionne toute la ligne (début de ligne puis shift+fin)
map cmd+a         send_text all \x01\x1b[1;2F
# cmd+shift+← / → : sélectionne jusqu'au début / à la fin de la ligne
map cmd+shift+left  send_text all \x1b[1;2H
map cmd+shift+right send_text all \x1b[1;2F
map cmd+delete    send_text all \x05\x15
# cmd+⌫ : efface toute la ligne de commande (fin de ligne puis tout effacer)
map cmd+backspace send_text all \x05\x15
# ⌥+⌫ : efface le mot précédent
map alt+backspace send_text all \x17

# ── Nouveaux raccourcis cmd ──
map cmd+shift+return toggle_layout stack
map cmd+shift+f   focus_visible_window
map cmd+shift+up   scroll_to_prompt -1
map cmd+shift+down scroll_to_prompt 1
map cmd+g          show_last_command_output
