# ╔══════════════════════════════════════════════════════════════════╗
# ║                     K I T T Y  ·  config de fou                  ║
# ║   Recharger à chaud : ctrl+shift+F5   ·   Éditer : ctrl+shift+F2   ║
# ╚══════════════════════════════════════════════════════════════════╝

# ─── Thème & réglages par OS ─────────────────────────────────────────
include theme.conf
# Charge macos.conf ou linux.conf automatiquement selon le système
include ${KITTY_OS}.conf

# ─── Police ──────────────────────────────────────────────────────────
# Installe JetBrains Mono Nerd Font (ou change ici). Kitty embarque déjà
# les icônes Nerd Font, donc n'importe quelle police mono marche aussi.
# Astuce : `kitten choose-fonts` pour tester visuellement.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Un peu d'air entre les lignes
modify_font cell_height 112%
# Ligatures (=> != ===) sauf sous le curseur, pour éditer proprement
disable_ligatures cursor

# ─── Curseur ─────────────────────────────────────────────────────────
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
# Traînée animée quand le curseur saute (le petit effet "wow")
cursor_trail               3
cursor_trail_decay         0.1 0.4
cursor_trail_start_threshold 2

# ─── Scrollback ──────────────────────────────────────────────────────
scrollback_lines             20000
# Historique supplémentaire (en Mo) visible dans le pager
scrollback_pager_history_size 256
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier      4.0
touch_scroll_multiplier      2.0

# ─── Souris, sélection & liens ───────────────────────────────────────
copy_on_select          clipboard
strip_trailing_spaces   smart
url_style               curly
detect_urls             yes
show_hyperlink_targets  yes
underline_hyperlinks    hover
mouse_hide_wait         2.0
focus_follows_mouse     no
select_by_word_characters @-./_~?&=%+#

# Clic simple = sélection, ctrl+clic = ouvrir le lien (plus d'ouvertures accidentelles)
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left press ungrabbed mouse_selection normal

# ─── Performances ────────────────────────────────────────────────────
repaint_delay   6
input_delay     2
sync_to_monitor yes

# ─── Cloche & notifications ──────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab          "󰂞 "
# Notif système quand une commande de +10 s finit pendant que tu es ailleurs
notify_on_cmd_finish unfocused 10.0

# ─── Fenêtres & layouts ──────────────────────────────────────────────
remember_window_size  yes
initial_window_width  150c
initial_window_height 42c
window_padding_width  6 10
placement_strategy    center
enabled_layouts       splits,stack,tall,fat,grid
window_border_width   1.5pt
draw_minimal_borders  yes
inactive_text_alpha   0.75
hide_window_decorations titlebar-only
confirm_os_window_close -1
resize_debounce_time  0.05

# ─── Barre d'onglets ─────────────────────────────────────────────────
tab_bar_edge            top
tab_bar_margin_height   4.0 0.0
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
tab_activity_symbol     "● "
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_max_length    32
tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {'󰉋 ' if layout_name == 'stack' and num_windows > 1 else ''}{title}{' ['+str(num_windows)+']' if num_windows > 1 else ''}"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{index} {'󰊓 ' if layout_name == 'stack' and num_windows > 1 else ''}{title}{' ['+str(num_windows)+']' if num_windows > 1 else ''}"

# ─── Transparence ────────────────────────────────────────────────────
background_opacity         0.92
background_blur            32
dynamic_background_opacity yes

# ─── Intégration shell & contrôle ────────────────────────────────────
# Active : sauter entre prompts, voir la sortie de la dernière commande,
# ouvrir un nouvel onglet dans le même dossier, curseur beam dans le prompt…
shell_integration      enabled
allow_remote_control   socket-only
listen_on              unix:/tmp/kitty-{kitty_pid}
clipboard_control      write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_hyperlinks       yes
term                   xterm-kitty

# ═════════════════════════════════════════════════════════════════════
#                           RACCOURCIS
#   kitty_mod = ctrl+shift (cmd fonctionne aussi pour beaucoup sur macOS)
# ═════════════════════════════════════════════════════════════════════
kitty_mod ctrl+shift

# ─── Copier / coller ─────────────────────────────────────────────────
# ctrl+c copie s'il y a une sélection, sinon envoie l'interruption normale
map ctrl+c copy_and_clear_or_interrupt
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# ─── Splits façon tmux (dans le dossier courant) ─────────────────────
map kitty_mod+enter   launch --cwd=current --location=split
map kitty_mod+backslash launch --cwd=current --location=vsplit
map kitty_mod+minus   launch --cwd=current --location=hsplit
map kitty_mod+w       close_window
map kitty_mod+m       toggle_layout stack
map kitty_mod+space   next_layout
map kitty_mod+o       layout_action rotate

# Navigation entre panneaux (vim-style + flèches)
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map ctrl+alt+left  neighboring_window left
map ctrl+alt+down  neighboring_window down
map ctrl+alt+up    neighboring_window up
map ctrl+alt+right neighboring_window right

# Déplacer un panneau
map ctrl+alt+h move_window left
map ctrl+alt+j move_window down
map ctrl+alt+k move_window up
map ctrl+alt+l move_window right

# Redimensionner (ou kitty_mod+r pour le mode interactif)
map ctrl+alt+shift+left  resize_window narrower 3
map ctrl+alt+shift+right resize_window wider 3
map ctrl+alt+shift+up    resize_window taller 3
map ctrl+alt+shift+down  resize_window shorter 3
map ctrl+alt+equal       resize_window reset

# Sélecteur visuel de panneau (lettres à l'écran)
map kitty_mod+f focus_visible_window
map kitty_mod+x swap_with_window

# ─── Onglets ─────────────────────────────────────────────────────────
map kitty_mod+t      new_tab_with_cwd
map kitty_mod+q      close_tab
map kitty_mod+right  next_tab
map kitty_mod+left   previous_tab
map kitty_mod+period move_tab_forward
map kitty_mod+comma  move_tab_backward
map kitty_mod+alt+t  set_tab_title
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab -1
map kitty_mod+tab goto_tab -1

# ─── Scrollback & prompts (nécessite shell_integration) ──────────────
map kitty_mod+y  show_scrollback
map kitty_mod+g  show_last_command_output
map kitty_mod+up   scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end  scroll_end
# Recherche dans tout le scrollback avec fzf (si installé), sinon less
map kitty_mod+slash launch --type=overlay --stdin-source=@screen_scrollback sh -c 'command -v fzf >/dev/null && fzf --no-sort --no-mouse --exact -i --tac || less -R +G'

# ─── Hints (sélection clavier de choses à l'écran) ───────────────────
map kitty_mod+e      open_url_with_hints
map kitty_mod+p>f    kitten hints --type path --program -
map kitty_mod+p>shift+f kitten hints --type path
map kitty_mod+p>l    kitten hints --type line --program -
map kitty_mod+p>w    kitten hints --type word --program -
map kitty_mod+p>h    kitten hints --type hash --program -
map kitty_mod+p>n    kitten hints --type linenum
map kitty_mod+p>i    kitten hints --type ip --program -

# ─── Police & opacité à la volée ─────────────────────────────────────
map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+plus      change_font_size all +1.0
map kitty_mod+underscore change_font_size all -1.0
map kitty_mod+0         change_font_size all 0
map kitty_mod+a>m set_background_opacity +0.05
map kitty_mod+a>l set_background_opacity -0.05
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default

# ─── Divers ──────────────────────────────────────────────────────────
map kitty_mod+u         kitten unicode_input
map kitty_mod+f11       toggle_fullscreen
map kitty_mod+f10       toggle_maximized
map kitty_mod+escape    kitty_shell window
map kitty_mod+f2        edit_config_file
map kitty_mod+f5        load_config_file
map kitty_mod+f6        debug_config
map kitty_mod+delete    clear_terminal reset active
map kitty_mod+backspace clear_terminal to_cursor active
# Ouvre le sélecteur de thèmes (des centaines, aperçu live)
map kitty_mod+f8        kitten themes
# Navigateur de fichiers rapide en overlay (yazi > ranger > lf si installés)
map kitty_mod+n launch --type=overlay --cwd=current sh -c 'for f in yazi ranger lf; do command -v $f >/dev/null && exec $f; done; echo "Installe yazi, ranger ou lf"; read'
# htop/btop en overlay
map kitty_mod+b launch --type=overlay sh -c 'command -v btop >/dev/null && exec btop || exec top'
